# ─────────────────────────────────────────────────────────────────────────────
# Reverse Workflow Platform — full stack
#
#   reverse-workflow-service (Node)  ── orchestrator, HTTP :5005
#   llm-service (Python/FastAPI)     ── LLM (Ollama), HTTP :8000
#   neo4j                            ── knowledge graph, :7474 (UI) / :7687 (bolt)
#   postgres                         ── relational store (shared), :5432
#   ollama                           ── local model runtime, :11434
#
# Quick start:
#   cp .env.example .env      # then edit secrets
#   docker compose up -d --build
#   docker compose exec ollama ollama pull dengcao/Qwen3-8B:Q5_K_M
# ─────────────────────────────────────────────────────────────────────────────

services:
  
  # ───────────────────────────── Orchestrator (Node) ────────────────────────
  reverse-workflow-service:
    build: ./services/reverse-workflow-service
    container_name: rwp-orchestrator
    env_file: .env
    environment:
      # data stores
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-reverser}
      POSTGRES_USER: ${POSTGRES_USER:-reverser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # the python llm service
      LLM_API_URL: http://llm-service:8000
      LLM_API_PREFIX: /api/v1
      LLM_AUTH_USER: ${LLM_AUTH_USER:-admin}
      LLM_AUTH_PASS: ${LLM_AUTH_PASS:-admin}
      # shuffle integration
      SHUFFLE_API_URL: ${SHUFFLE_API_URL}
      SHUFFLE_API_KEY: ${SHUFFLE_API_KEY}
      SHUFFLE_CLOUD_URL: ${SHUFFLE_CLOUD_URL:-}
      SHUFFLE_CLOUD_API_KEY: ${SHUFFLE_CLOUD_API_KEY:-}
      APP_SYNC_TTL_HOURS: ${APP_SYNC_TTL_HOURS:-24}
    ports:
      - "5005:5005"
    networks:
    - platform
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      llm-service:
        condition: service_started
    restart: unless-stopped

  # ───────────────────────────── LLM service (Python) ───────────────────────
  llm-service:
    build: ./services/llm-service
    container_name: rwp-llm
    env_file: .env
    environment:
      SECRET_KEY: ${LLM_SECRET_KEY:-change-me-in-env}
      # postgres (shared instance, same creds as the orchestrator)
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-reverser}
      POSTGRES_USER: ${POSTGRES_USER:-reverser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # neo4j
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      # ollama
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-dengcao/Qwen3-8B:Q5_K_M}
      # shuffle (optional; offline-ok by default)
      SHUFFLE_API_URL: ${SHUFFLE_API_URL:-}
      SHUFFLE_API_KEY: ${SHUFFLE_API_KEY:-}
    ports:
      - "8000:8000"
    networks:
    - platform
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  # ───────────────────────────── Neo4j ──────────────────────────────────────
  neo4j:
    image: neo4j:5
    container_name: rwp-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    networks:
    - platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ───────────────────────────── Postgres ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rwp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reverser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-reverser}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Python service's schema (idempotent; SQLAlchemy also creates it on boot)
      - ./services/llm-service/scripts/init_db.sql:/docker-entrypoint-initdb.d/10-llm.sql
    networks:
    - platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reverser} -d ${POSTGRES_DB:-reverser}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped


  # ───────────────────────────── Ollama (model runtime) ─────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rwp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    networks:
    - platform
    restart: unless-stopped
    # GPU users: uncomment to expose NVIDIA GPUs to Ollama.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  neo4j_data:
  pg_data:

networks:
  platform:
    external: true
    name: shared-platform