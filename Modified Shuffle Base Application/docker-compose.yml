services:

  # =========================
  # SHUFFLE FRONTEND
  # =========================
  frontend:
    # image: ghcr.io/shuffle/shuffle-frontend:latest
    build: ./frontend
    container_name: shuffle-frontend
    hostname: shuffle-frontend
    ports:
      - "${FRONTEND_PORT}:80"
      - "${FRONTEND_PORT_HTTPS}:443"
    environment:
      - BACKEND_HOSTNAME=backend
    depends_on:
      - backend
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # SHUFFLE BACKEND
  # =========================
  backend:
    # image: ghcr.io/shuffle/shuffle-backend:latest
    build: ./backend
    container_name: shuffle-backend
    hostname: backend
    ports:
      - "${BACKEND_PORT}:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SHUFFLE_APP_HOTLOAD_LOCATION}:/shuffle-apps:z
      - ${SHUFFLE_FILE_LOCATION}:/shuffle-files:z
    env_file: .env
    environment:
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - SHUFFLE_FILE_LOCATION=/shuffle-files
      - BASE_URL=http://backend:5001
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # ORBORUS
  # =========================
  orborus:
    image: ghcr.io/shuffle/shuffle-orborus:latest
    container_name: shuffle-orborus
    hostname: orborus
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    environment:
      - BASE_URL=http://backend:5001
      - ENVIRONMENT_NAME=Shuffle
      - ORG_ID=Shuffle
      - DOCKER_API_VERSION=1.40
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # OPENSEARCH
  # =========================
  opensearch:
    image: opensearchproject/opensearch:3.2.0
    container_name: shuffle-opensearch
    environment:
      - cluster.name=shuffle-cluster
      - node.name=shuffle-opensearch
      - discovery.seed_hosts=shuffle-opensearch
      - cluster.initial_master_nodes=shuffle-opensearch
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${SHUFFLE_OPENSEARCH_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - shuffle-database:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - platform
    restart: unless-stopped

# =========================
# VOLUMES
# =========================
volumes:
  shuffle-database:
  pgdata:
  qdrant_data:
  ollama_data:
  # neo4j_data TIDAK DIPERLUKAN — pakai Neo4j Aura (cloud external)


# =========================
# NETWORK
# =========================
# networks:
#   platform:
#     driver: bridge
networks:
  platform:
    external: true
    name: shared-platform