services:

  # =========================
  # SHUFFLE FRONTEND
  # =========================
  frontend:
    # image: ghcr.io/shuffle/shuffle-frontend:latest
    build: ./frontend
    container_name: shuffle-frontend
    hostname: shuffle-frontend
    ports:
      - "${FRONTEND_PORT}:80"
      - "${FRONTEND_PORT_HTTPS}:443"
    environment:
      - BACKEND_HOSTNAME=backend
    depends_on:
      - backend
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # SHUFFLE BACKEND
  # =========================
  backend:
    # image: ghcr.io/shuffle/shuffle-backend:latest
    build: ./backend
    container_name: shuffle-backend
    hostname: backend
    ports:
      - "${BACKEND_PORT}:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SHUFFLE_APP_HOTLOAD_LOCATION}:/shuffle-apps:z
      - ${SHUFFLE_FILE_LOCATION}:/shuffle-files:z
    env_file: .env
    environment:
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - SHUFFLE_FILE_LOCATION=/shuffle-files
      - BASE_URL=http://backend:5001
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # ORBORUS
  # =========================
  orborus:
    image: ghcr.io/shuffle/shuffle-orborus:latest
    container_name: shuffle-orborus
    hostname: orborus
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    environment:
      - BASE_URL=http://backend:5001
      - ENVIRONMENT_NAME=Shuffle
      - ORG_ID=Shuffle
      - DOCKER_API_VERSION=1.40
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # OPENSEARCH
  # =========================
  opensearch:
    image: opensearchproject/opensearch:3.2.0
    container_name: shuffle-opensearch
    environment:
      - cluster.name=shuffle-cluster
      - node.name=shuffle-opensearch
      - discovery.seed_hosts=shuffle-opensearch
      - cluster.initial_master_nodes=shuffle-opensearch
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${SHUFFLE_OPENSEARCH_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - shuffle-database:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # REVERSE WORKFLOW SERVICE (Node.js)
  # Neo4j: pakai Neo4j Aura (cloud) — dibaca dari .env (NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD)
  # Step 1-4 : parse → buildGraph → saveGraphToNeo4j (Aura)
  # Step 5   : POST http://llm-api:8000/generate/reverse
  # Step 6-8 : validate → importWorkflowToShuffle
  # =========================
  reverse-workflow-service:
    build:
      context: ./reverse-workflow-service
    container_name: reverse-workflow-service
    ports:
      - "5005:5005"
    env_file: .env   # membaca NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD, SHUFFLE_API_KEY, dll
    environment:
      - LLM_API_URL=http://llm-api:8000       # Python LLM service (Step 5)
      - SHUFFLE_URL=${SHUFFLE_URL:-http://host.docker.internal:3000}  # untuk importWorkflowToShuffle
    depends_on:
      - llm-api
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # LLM POSTGRES
  # =========================
  postgres:
    image: postgres:16
    container_name: playbook-postgres
    environment:
      POSTGRES_USER: playbook
      POSTGRES_PASSWORD: playbook
      POSTGRES_DB: playbooks
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # VECTOR DB
  # =========================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: playbook-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # OLLAMA (LLM ENGINE)
  # =========================
  ollama:
    image: ollama/ollama:latest
    container_name: playbook-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # LLM API (PLAYBOOK SYSTEM)
  # Neo4j: pakai Neo4j Aura (cloud) — dibaca dari .env (NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD)
  # POST /generate/playbook  — forward pipeline (NL → Shuffle JSON)
  # POST /generate/reverse   — reverse pipeline (Neo4j Aura graph → Shuffle JSON)
  # =========================
  llm-api:
    build: ./llm
    container_name: playbook-api
    env_file: .env   # membaca NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD, OLLAMA_HOST, LLM_MODEL, dll
    depends_on:
      - postgres
      - qdrant
      - ollama
    ports:
      - "8000:8000"
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # LLM UI
  # =========================
  llm-ui:
    image: nginx:alpine
    container_name: playbook-ui
    volumes:
      - ./llm/ui:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - llm-api
    networks:
      - platform
    restart: unless-stopped


  # =========================
  # OPTIONAL MONITORING
  # =========================
  prometheus:
    image: prom/prometheus:latest
    container_name: playbook-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    networks:
      - platform

  grafana:
    image: grafana/grafana:latest
    container_name: playbook-grafana
    profiles: ["monitoring"]
    ports:
      - "3333:3333"
    networks:
      - platform


# =========================
# VOLUMES
# =========================
volumes:
  shuffle-database:
  pgdata:
  qdrant_data:
  ollama_data:
  # neo4j_data TIDAK DIPERLUKAN — pakai Neo4j Aura (cloud external)


# =========================
# NETWORK
# =========================
networks:
  platform:
    driver: bridge