# AI Playbook Recommender for Shuffle SOAR — full stack.
# Core services run by default. Monitoring is opt-in:  docker compose --profile monitoring up -d
services:
  postgres:
    image: postgres:16
    container_name: playbook-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playbook}
      POSTGRES_DB: ${POSTGRES_DB:-playbooks}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playbook}"]
      interval: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: playbook-qdrant
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: playbook-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build: .
    container_name: playbook-api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    ports:
      - "8000:8000"

  ui:
    image: nginx:alpine
    container_name: playbook-ui
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    container_name: playbook-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: playbook-grafana
    profiles: ["monitoring"]
    ports:
      - "3333:3333"

volumes:
  pgdata:
  qdrant_data:
  ollama_data:
